# Override GPU NVIDIA pour le service Ollama — active l'inférence GPU du LLM
# local du RAG (qwen2.5-coder:14b, ~9 Go en q4_K_M ; 12 Go de VRAM recommandés).
#
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d ollama
#   docker compose exec ollama ollama pull qwen2.5-coder:14b
#
# Requis : NVIDIA Container Toolkit installé sur l'hôte
# (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/).
# Sans GPU, garder `docker compose up -d ollama` (inférence CPU, plus lente).

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
