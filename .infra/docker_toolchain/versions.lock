# versions.lock — registre des versions figées de la chaîne Circuitron.
# Format TOML valide (lisible par tomllib / pip-tools) — source de vérité
# unique : Dockerfile.base, Dockerfile.service et requirements.txt y font
# référence. Toute évolution = commit dédié + rebuild des images + publication
# de nouveaux digests.

[toolchain]
python = "3.11.9"            # python:3.11.9-slim-bookworm (image de base)

[eda_toolchain]
kicad = "8.0.5"              # ppa:kicad/kicad-8.0-releases — parse/footprints/CLI
skidl = "1.2.1"              # NL->netlist (étape 1 du workflow)
freerouting = "2.6.1"        # jar Java 17 — moteur de routage externe optionnel
java_jre = "17"              # openjdk-17-jre-headless (hôte de freerouting.jar)

[compute]
cuda = "12.4"                # runtime nvidia/cuda:12.4.1-runtime-ubuntu22.04 (variante GPU)
numpy = "1.26.4"             # socle numérique gelé (compat CUDA 12.4 / cupy 13.x)

[python_app]
fastapi = "0.111.0"
uvicorn = "0.30.1"
pydantic = "2.7.4"
prometheus_client = "0.20.0"
grpcio = "1.62.2"
protobuf = "4.25.3"
neo4j = "5.20.0"
redis = "5.0.4"
python_jose = "3.3.0"
scikit_learn = "1.4.2"
pyyaml = "6.0.1"
cupy_cuda12x = "13.1"        # optionnel — variante GPU uniquement

[storage_services]
redis_server = "7.2"         # image redis:7-alpine (docker-compose.yml)
neo4j_server = "5.20-community"  # image neo4j:5-community
postgres_server = "16"       # image postgres:16-alpine
minio = "RELEASE.2024-05-01" # minio/minio figé au moment de la release

[images]
pcb_base_cpu = "pcb-base:2.0.0-cpu"
pcb_base_cuda = "pcb-base:2.0.0-cuda12.4"
pcb_service = "pcb-service:2.0.0"      # 9 microservices — même image, SERVICE_MODULE différent

[justification_circuitron]
criterion = "même entrée -> même sortie"
text = """
La promesse Circuitron portée par cette plateforme est la reproductibilité
bit-à-bit de la chaîne de conception : un design certifié rejoué doit produire
EXACTEMENT le même Gerber, le même score DRC et les mêmes métriques (vias,
longueurs routées). Or KiCad, SKiDL et FreeRouting évoluent vite et leurs
versions changent silencieusement la numérotation des couches, les empreintes
ou les heuristiques de routage. Le gel complet (versions exactes ci-dessus,
jamais de plage >=) et l'épinglement par digest des images rendent la chaîne
déterministe : le harnais tests/vs_quilter_benchmark peut alors rejouer les
designs de référence et bloquer une release à la moindre régression
(baseline.json committed, gate CI).
"""
