{{/*
Secret Opaque — identifiants consommés par les 9 déploiements (envFrom).
Les valeurs transitent par `data` + b64enc (encodage, PAS du chiffrement).

AVERTISSEMENTS PRODUCTION :
  1. Ne jamais committer de vraies valeurs dans values.yaml — les défauts
     `change-me-in-production` déclenchent un `warnf` à chaque `helm template`.
  2. En production, fournir les secrets par `helm upgrade --set-string` depuis
     un coffre, ou substituer ce template par un SealedSecret / ExternalSecret :
     le secretRef côté Deployment reste inchangé (même nom de manifeste).
*/}}
{{- $secrets := .Values.secrets }}
{{- $defaultSentinel := "change-me-in-production" }}
{{- range $key, $val := $secrets }}
{{- if eq $val $defaultSentinel }}
{{- warnf "secrets.%s utilise la valeur par défaut %r — interdit en production (fournir --set-string secrets.%s=...)" $key $defaultSentinel $key }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pcb-ai-designer.fullname" (dict "root" . "service" "secrets") }}
  labels:
    {{- include "pcb-ai-designer.labels" (merge (dict "component" "secrets") .) | nindent 4 }}
  annotations:
    pcb-ai.example.com/secret-policy: "rotation trimestrielle — voir runbook sécurité"
type: Opaque
data:
  JWT_SECRET: {{ $secrets.JWT_SECRET | b64enc | quote }}
  NEO4J_PASSWORD: {{ $secrets.NEO4J_PASSWORD | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $secrets.POSTGRES_PASSWORD | b64enc | quote }}
  S3_ACCESS_KEY: {{ $secrets.S3_ACCESS_KEY | b64enc | quote }}
  S3_SECRET_KEY: {{ $secrets.S3_SECRET_KEY | b64enc | quote }}
