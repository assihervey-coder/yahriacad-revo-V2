# Valeurs Helm par défaut — pcb-ai-designer v2.0.0 (spec section 07).
# Structure : `global` (image, env commun, probes) puis `services`, la carte des
# 9 déploiements parcourue par les templates (range sur .Values.services).
#
# Conventions :
#   - chaque service expose son port gRPC (50051-50057, orchestrator 50060,
#     gateway HTTP 8000) + un port métriques 9091 scraffé par Prometheus ;
#   - les services d'inférence (ai_engine héberge le rl_agent, simulator) Portent
#     gpu.enabled: true -> nvidia.com/gpu: 1 + nodeSelector sur le pool "gpu" ;
#   - les autres services restent sur le pool CPU générique ;
#   - les autoscalers cibles 70 % de CPU (HPA autoscaling/v2).

global:
  image:
    registry: ghcr.io
    repository: pcb-ai/pcb-ai-designer
    tag: "2.0.0"                 # figé par digest au déploiement prod (see README docker_toolchain)
    pullPolicy: IfNotPresent
  # Environnement injecté dans les 9 pods (équivalent configMap pcb-env).
  env:
    APP_ENV: production
    LOG_LEVEL: INFO
    REDIS_URL: redis://redis-master.data.svc.cluster.local:6379/0
    NEO4J_URI: bolt://neo4j.data.svc.cluster.local:7687
    POSTGRES_DSN: postgresql://pcb@postgres.data.svc.cluster.local:5432/pcb_designer
    S3_ENDPOINT: http://minio.data.svc.cluster.local:9000
    S3_BUCKET: pcb-projects
    # Graphe de connaissances [Circuitron] — data/knowledge_graph_db/
    NEO4J_DATABASE: neo4j
    # Bus de contraintes multi-pods (fallback mémoire si Redis indisponible)
    CONSTRAINT_BUS_TARGET_MS: "50"
  probes:
    path: /health                # endpoint exposé par chaque service (gateway + gRPC wrappers)
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  nodeSelector:
    cpu:
      pcb.ai/node-pool: general  # pool CPU générique (défaut)
    gpu:
      pcb.ai/node-pool: gpu      # pool GPU — nvidia.com/gpu requis (driver >= 550, CUDA 12.4)

# Secrets Opaque rendus par templates/secret.yaml.
# ATTENTION : ces valeurs par défaut existent uniquement pour que `helm install`
# aboutisse en dev ; en production, fournir les vraies valeurs via
# `--set-string secrets.JWT_SECRET=...` ou un SealedSecret (voir secret.yaml).
secrets:
  JWT_SECRET: change-me-in-production
  NEO4J_PASSWORD: change-me-in-production
  POSTGRES_PASSWORD: change-me-in-production
  S3_ACCESS_KEY: change-me-in-production
  S3_SECRET_KEY: change-me-in-production

services:
  # ---------- passerelle publique (FastAPI / GraphQL / MCP / WebSocket) ----------
  api_gateway:
    replicas: 3
    image: {}                    # hérite de global.image + nom du service
    containerPorts:
      - { name: http, containerPort: 8000 }
      - { name: metrics, containerPort: 9091 }
    servicePorts:
      - { name: http, port: 8000, targetPort: http }
      - { name: metrics, port: 9091, targetPort: metrics }
    probePort: http
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "2", memory: 1Gi }
    env:
      SERVICE_NAME: api_gateway
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      targetCPUUtilizationPercentage: 70

  # ---------- orchestrateur multi-agents ----------
  orchestrator:
    replicas: 2
    containerPorts:
      - { name: grpc, containerPort: 50060 }
      - { name: metrics, containerPort: 9091 }
    servicePorts:
      - { name: grpc, port: 50060, targetPort: grpc }
      - { name: metrics, port: 9091, targetPort: metrics }
    probePort: metrics
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits: { cpu: "1", memory: 768Mi }
    env:
      SERVICE_NAME: orchestrator
      GRPC_PORT: "50060"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  # ---------- 7 services gRPC ----------
  parser:
    replicas: 2
    containerPorts:
      - { name: grpc, containerPort: 50051 }
      - { name: metrics, containerPort: 9091 }
    servicePorts:
      - { name: grpc, port: 50051, targetPort: grpc }
      - { name: metrics, port: 9091, targetPort: metrics }
    probePort: metrics
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits: { cpu: "1", memory: 768Mi }
    env:
      SERVICE_NAME: parser
      GRPC_PORT: "50051"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70

  ai_engine:
    replicas: 2
    containerPorts:
      - { name: grpc, containerPort: 50052 }
      - { name: metrics, containerPort: 9091 }
    servicePorts:
      - { name: grpc, port: 50052, targetPort: grpc }
      - { name: metrics, port: 9091, targetPort: metrics }
    probePort: metrics
    # Le rl_agent (placement/routage RL) est déployé au sein d'ai_engine -> GPU.
    gpu:
      enabled: true
      count: 1
    nodeSelectorKey: gpu
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "4", memory: 8Gi }
    env:
      SERVICE_NAME: ai_engine
      GRPC_PORT: "50052"
      ENABLE_CUDA: "true"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70

  simulator:
    replicas: 2
    containerPorts:
      - { name: grpc, containerPort: 50053 }
      - { name: metrics, containerPort: 9091 }
    servicePorts:
      - { name: grpc, port: 50053, targetPort: grpc }
      - { name: metrics, port: 9091, targetPort: metrics }
    probePort: metrics
    # Simulation multiphysique (thermique/électrique) accélérée CUDA.
    gpu:
      enabled: true
      count: 1
    nodeSelectorKey: gpu
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "4", memory: 8Gi }
    env:
      SERVICE_NAME: simulator
      GRPC_PORT: "50053"
      ENABLE_CUDA: "true"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70

  router:
    replicas: 2
    containerPorts:
      - { name: grpc, containerPort: 50054 }
      - { name: metrics, containerPort: 9091 }
    servicePorts:
      - { name: grpc, port: 50054, targetPort: grpc }
      - { name: metrics, port: 9091, targetPort: metrics }
    probePort: metrics
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: "2", memory: 2Gi }
    env:
      SERVICE_NAME: router
      GRPC_PORT: "50054"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  drc_dfm_engine:
    replicas: 2
    containerPorts:
      - { name: grpc, containerPort: 50055 }
      - { name: metrics, containerPort: 9091 }
    servicePorts:
      - { name: grpc, port: 50055, targetPort: grpc }
      - { name: metrics, port: 9091, targetPort: metrics }
    probePort: metrics
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    env:
      SERVICE_NAME: drc_dfm_engine
      GRPC_PORT: "50055"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70

  firmware_bridge:
    replicas: 1
    containerPorts:
      - { name: grpc, containerPort: 50056 }
      - { name: metrics, containerPort: 9091 }
    servicePorts:
      - { name: grpc, port: 50056, targetPort: grpc }
      - { name: metrics, port: 9091, targetPort: metrics }
    probePort: metrics
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    env:
      SERVICE_NAME: firmware_bridge
      GRPC_PORT: "50056"
    autoscaling:
      enabled: false          # service léger : 1 pod suffit (génération firmware)
      minReplicas: 1
      maxReplicas: 2
      targetCPUUtilizationPercentage: 70

  exporter:
    replicas: 2
    containerPorts:
      - { name: grpc, containerPort: 50057 }
      - { name: metrics, containerPort: 9091 }
    servicePorts:
      - { name: grpc, port: 50057, targetPort: grpc }
      - { name: metrics, port: 9091, targetPort: metrics }
    probePort: metrics
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    env:
      SERVICE_NAME: exporter
      GRPC_PORT: "50057"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
