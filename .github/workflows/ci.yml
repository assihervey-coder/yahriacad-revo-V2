# CI pcb_ai_designer_v2 — lint, tests, benchmark gate, build images.
# Le job benchmark-gate bloque la release en cas de régression vs baseline.json
# (garde-fou permanent de la spécification, section 07).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntaxe & lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: compileall (aucune erreur de syntaxe tolérée)
        run: python -m compileall -q backend common tests scripts
      - name: ruff (best-effort)
        run: |
          pip install ruff
          ruff check backend common || true   # warning-only jusqu'à l'assainissement complet

  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer le socle
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
      - name: pytest tests/unit
        run: python -m pytest tests/unit -q

  rl-training:
    name: Passe RL (torch) — smoke
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer le socle + torch CPU
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest httpx
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Tests de la passe RL
        run: python -m pytest tests/unit/test_rl_training.py -q
      - name: Passe courte de bout en bout (CLI)
        run: |
          python -m backend.services.ai_engine.rl_agent.training.train \
            --episodes-dataset 10 --epochs-world 15 --episodes-rl 25 \
            --out out/rl_quick
      - name: Boucle nocturne branchée au world model (smoke)
        run: |
          python -m backend.services.ai_engine.nightly --skip-train --iters 20
      - name: Uploader le rapport d'entraînement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rl-training-report
          path: out/rl_quick/training_report.json

  docs:
    name: Documentation Sphinx
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer Sphinx
        run: pip install sphinx sphinx-rtd-theme numpy
      - name: Générer le HTML
        run: python -m sphinx -b html docs/sphinx docs/sphinx/_build/html
      - name: Uploader la documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html
          path: docs/sphinx/_build/html/

  benchmark-gate:
    name: Gate benchmark vs Quilter
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer le socle
        run: pip install numpy
      - name: Rejouer le corpus (3 designs x 3 replays, déterminisme exigé)
        run: |
          python -m tests.vs_quilter_benchmark.run_benchmark \
            --corpus tests/vs_quilter_benchmark/corpus \
            --report out/benchmark
      - name: Uploader le rapport de benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: out/benchmark/

  docker-build:
    name: Images outillage (Circuitron)
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        include:
          - name: service
            dockerfile: .infra/docker_toolchain/Dockerfile.service
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }}
        run: docker build -f ${{ matrix.dockerfile }} -t pcb-ai-designer:${{ matrix.name }} .
