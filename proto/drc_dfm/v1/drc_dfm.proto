// Service drc_dfm_engine — vérification design + manufacturing (section 6.4).
syntax = "proto3";

package pcb.drc.v1;

import "common/v1/common.proto";

message CheckRequest {
  pcb.common.v1.DesignRef design = 1;
  pcb.common.v1.Board board = 2;
  string factory_profile = 3;     // "pcbway" | "jlcpcb" | "internal" — manufacturing_rules
  bool include_erc = 4;           // exécute erc_executor (brique Circuitron)
  string skidl_source = 5;        // script SKiDL à vérifier électriquement (si include_erc)
}

message Violation {
  string rule_id = 1;             // ex. "DR-clearance-5mil", "MF-min-pad-pcbway"
  string severity = 2;            // "error" | "warning"
  string component_ref = 3;
  string net = 4;
  pcb.common.v1.BoundingBox area = 5;
  string message = 6;
}

message CheckReply {
  bool pass = 1;
  double score = 2;               // score composite DRC + SI + thermique + vias
  repeated Violation violations = 3;
  repeated Violation erc_errors = 4; // consommés par le corrector_agent (boucle runtime)
}

service DrcDfm {
  rpc Check(CheckRequest) returns (CheckReply);
}
